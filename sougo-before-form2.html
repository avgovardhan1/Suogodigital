<style>

.bgd{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;min-height:min(420px,60vh)}

.bgd h1{font-size:clamp(2.3rem,5.4vw,4rem)}
.crumb{display:inline-flex;gap:8px;align-items:center;font-size:.88rem;color:var(--mut);margin-bottom:20px;border:1px solid var(--line);background:rgba(255,255,255,.7);border-radius:99px;padding:5px 16px}
.crumb a{text-decoration:none}.crumb a:hover{color:var(--br)}.crumb b{color:var(--ink);font-weight:500}
.bv{position:relative;min-height:250px}
.bc{position:absolute;display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 20px;font-weight:500;box-shadow:0 24px 44px -22px rgba(60,52,137,.45);animation:fl 7s ease-in-out infinite;transition:box-shadow .3s}
.bc:hover{box-shadow:0 30px 56px -18px var(--br)}
.bc:nth-child(1){left:2%;top:4%}.bc:nth-child(2){right:0;top:36%;animation-delay:-2.4s}.bc:nth-child(3){left:12%;bottom:0;animation-delay:-4.6s}
.bc small{display:block;color:var(--mut);font-weight:400;font-size:.82rem}
.bc .art{width:48px;height:32px;margin:0}
.bc.bt{flex-direction:column;align-items:flex-start;gap:0;border:0;color:#fff;min-width:170px}
.bt b{font:600 1.9rem Sora,sans-serif;letter-spacing:-.04em;line-height:1.1}.bt small{color:rgba(255,255,255,.88)}
@media(max-width:860px){.bv{min-height:230px}}

.dd{position:relative}
.dm{position:absolute;top:100%;left:0;min-width:320px;max-height:72vh;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:8px;box-shadow:0 34px 64px -26px rgba(60,52,137,.45);display:none;z-index:80}
.dd:hover .dm,.dd:focus-within .dm{display:block}
.dm button{display:block;width:100%;text-align:left;background:none;border:0;padding:11px 16px;border-radius:12px;font:inherit;font-size:.95rem;color:var(--ink);cursor:pointer;transition:.2s}
.dm button:hover{background:var(--tint);color:var(--br);padding-left:20px}
@media(max-width:900px){.dm{display:none!important}}

.dd{display:flex;align-items:center}
.dd>a::after{content:"";width:6px;height:6px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .25s}
.dd:hover>a::after{transform:rotate(225deg) translateY(-1px)}
.dm{top:calc(100% + 10px)}
.dd::after{content:"";position:absolute;left:-10px;right:-10px;top:100%;height:18px}.dd.x .dm{display:none!important}
@media(max-width:900px){.bar{display:flex;justify-content:space-between}nav a{height:auto;min-height:46px}}

::selection{background:var(--br);color:#fff}
html{scrollbar-width:thin;scrollbar-color:#A99FF2 transparent}
::-webkit-scrollbar{width:11px}::-webkit-scrollbar-thumb{background:linear-gradient(var(--br),var(--ac));border-radius:9px;border:3px solid var(--bg)}
body{font-size:17.5px}
h1,h2{font-weight:500}h1{letter-spacing:-.05em}
.sec{margin-top:130px}
.pg{counter-reset:sec}
.sh h2::before{counter-increment:sec;content:"0" counter(sec);display:block;font:500 .78rem "DM Sans",sans-serif;letter-spacing:.24em;color:var(--ac);margin-bottom:14px}
.card{border-radius:26px;background:linear-gradient(180deg,rgba(255,255,255,.97),rgba(255,255,255,.78));box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(40,30,120,.04),0 26px 50px -30px rgba(60,52,137,.34)}
.card:hover{box-shadow:inset 0 1px 0 #fff,0 40px 70px -34px rgba(75,63,208,.5)}
.btn{padding:15px 30px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 12px 26px -14px var(--br)}
.btn.sm{padding:11px 22px}
.btn.g{box-shadow:none;background:rgba(255,255,255,.65)}
.bar{transition:box-shadow .3s,background .3s;box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
header.sc .bar{background:rgba(255,255,255,.9);box-shadow:inset 0 1px 0 #fff,0 24px 46px -28px rgba(60,52,137,.45)}
nav a.on{background:#fff;box-shadow:0 8px 18px -10px rgba(60,52,137,.45),0 0 0 1px var(--line)}
.chip[aria-pressed=true]{box-shadow:0 14px 28px -14px var(--br)}
.ban{box-shadow:inset 0 1px 0 #fff,0 60px 100px -60px rgba(75,63,208,.6)}
.ban h1{animation:hin 1.2s cubic-bezier(.2,.7,.2,1) both}
@keyframes hin{from{opacity:0;transform:translateY(28px);filter:blur(10px)}}
.vis::before{content:"";position:absolute;inset:4% 0 0 8%;background:radial-gradient(closest-side,rgba(75,63,208,.38),rgba(255,138,101,.14) 60%,transparent);filter:blur(34px);animation:gl 6s ease-in-out infinite alternate}
@keyframes gl{to{transform:scale(1.14);opacity:.65}}
.dash{position:relative;z-index:1}.phone,.fc{z-index:2}
.cta>*{position:relative;z-index:1}
.cta::after{content:"";position:absolute;right:-6%;top:-34%;width:46vw;height:46vw;max-width:580px;max-height:580px;border-radius:50%;border:1px solid rgba(255,255,255,.22);box-shadow:0 0 0 60px rgba(255,255,255,.04),0 0 0 120px rgba(255,255,255,.03);pointer-events:none}

<div class="grid" id="pl"></div>${faq()}${cta()}`,

about:()=>`${ph("About","A small studio with a big standard","We design premium websites and run the marketing that helps your business keep moving forward.",A.about)}
<div class="sec" style="margin-top:60px"><p class="big rv">We combine marketing thinking with real technical skill, so your website, campaigns and automation work as one system.</p></div>
<div class="sec"><div class="sh rv"><h2>How we work</h2></div><div class="grid">${[["Clear pricing","You know the cost before work begins."],["Plain updates","Regular progress notes, no jargon."],["Results first","We report leads and sales, not vanity numbers."]].map(c=>`<div class="card rv"><h3>${c[0]}</h3><p>${c[1]}</p></div>`).join("")}</div></div>
<div class="sec">${stats()}</div>${cta()}`,

contact:()=>`${ph("Contact","Tell us about your project","Share a few details and we will reply with next steps and a clear price.",A.contact)}
<div class="cg"><div class="rv">${EMAILS.map(e=>`<a class="card" style="display:block;margin-bottom:14px;text-decoration:none" href="mailto:${e}"><h3>Email</h3><p style="margin:0">${e}</p></a>`).join("")}${WAS.map(w=>`<a class="card" style="display:block;margin-bottom:14px;text-decoration:none" href="https://wa.me/${w}" target="_blank" rel="noopener"><h3>WhatsApp</h3><p style="margin:0">+${w}</p></a>`).join("")}
<div class="card" style="margin-bottom:14px"><h3>What happens next</h3><ol style="color:var(--mut);padding-left:20px;margin:0"><li>We read your message.</li><li>We reply with questions or a plan.</li><li>You approve, and we start.</li></ol></div></div>
<div class="card rv"><form id="cf" novalidate><div><div style="font-weight:500;margin-bottom:8px">I need</div><div class="chips" id="need" style="margin:0">${["Website","eCommerce","SEO","Google Ads","Social media","Lead generation","Hosting"].map(c=>`<button type="button" class="chip" aria-pressed="false">${c}</button>`).join("")}</div></div>
<div class="f"><input id="n" placeholder=" " autocomplete="name"><label for="n">Your name</label><div class="err" id="en"></div></div>
<div class="f"><input id="e" type="email" placeholder=" " autocomplete="email"><label for="e">Email</label><div class="err" id="ee"></div></div>
<label style="display:grid;gap:6px">Budget: <b id="bo"></b><input id="b" type="range" min="10000" max="500000" step="5000" value="50000"></label>
<div class="f"><input id="ph" type="tel" placeholder=" " autocomplete="tel"><label for="ph">Phone number</label><div class="err" id="ep"></div></div>
<input id="hp" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;opacity:0">
<div class="f"><textarea id="m" placeholder=" "></textarea><label for="m">Tell us about your project</label><div class="err" id="em"></div></div>
<button class="btn" type="submit">Send enquiry</button></form>
<div id="done" hidden role="status"><h3 id="dh">Thank you</h3><p id="dm" style="color:var(--mut)"></p><div class="row" id="dact" style="margin-top:12px"></div></div></div></div>`};

$("mainx").innerHTML=PG.map(p=>`<section class="pg" id="${p}">${H[p]()}</section>`).join("");
$("nav").innerHTML=PG.map(p=>{const l=`<a href="#${p}" data-p="${p}">${p[0].toUpperCase()+p.slice(1)}</a>`;return p==="services"?`<div class="dd">${l}<div class="dm">${SV.map((x,i)=>`<button data-sv="${i}">${x[2]}</button>`).join("")}</div></div>`:l}).join("");
$("ftx").innerHTML=`<div class="fg"><div><a class="logo" href="#home"><svg aria-hidden="true"><use href="#lg"/></svg><span>Sou<b>Go</b> Digital</span></a><p style="color:var(--mut);margin-top:14px">Premium websites, marketing and automation that help your business go further.</p></div>
<div><h3>Pages</h3>${PG.slice(0,3).map(p=>`<a href="#${p}">${p[0].toUpperCase()+p.slice(1)}</a>`).join("")}</div>
<div><h3>Company</h3><a href="#pricing">Pricing</a><a href="#about">About</a><a href="#contact">Contact</a></div>
<div><h3>Services</h3><a href="#services">Website Development</a><a href="#services">SEO Services</a><a href="#services">Google Ads</a><a href="#services">Web Hosting</a></div></div>
<div class="cp"><span>© ${new Date().getFullYear()} SouGo Digital. Websites that go further.</span><a href="#home" style="color:var(--mut)">Back to top ↑</a></div><div class="gw" aria-hidden="true">SouGo Digital</div>`;

const uniq=a=>a.filter((v,i)=>a.indexOf(v)===i);
const toast=t=>{const e=$("toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),2400)};
const chips=(id,list,fn)=>{const el=$(id);el.innerHTML=["All",...list].map((c,i)=>`<button class="chip" aria-pressed="${i===0}">${c}</button>`).join("");el.onclick=e=>{const b=e.target.closest(".chip");if(!b)return;qa(".chip",el).forEach(c=>c.setAttribute("aria-pressed",c===b));fn(b.textContent)}};
const dlg=(t,d,g)=>{$("dt").textContent=t;$("dd").textContent=d;$("dg").innerHTML=g.map(x=>`<li>${x}</li>`).join("");$("dlg").showModal()};
const rvAll=r=>qa(".rv:not(.q)",r).forEach((el,i)=>{el.classList.add("q");el.style.setProperty("--d",(i%4)*.08+"s");rvo.observe(el)});
const rvo=new IntersectionObserver(en=>en.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");const t=x.target;setTimeout(()=>t.classList.add("dn"),1500);rvo.unobserve(t)}}),{threshold:.1});

const rs=c=>{$("sl").innerHTML=SV.map((s,i)=>[s,i]).filter(x=>c==="All"||x[0][1]===c).map(x=>sv(x[0],x[1])).join("");rvAll($("sl"))};
chips("sc",uniq(SV.map(s=>s[1])),rs);rs("All");
const rw=c=>{$("wl").innerHTML=WK.filter(w=>c==="All"||w[1]===c).map(wk).join("");rvAll($("wl"))};
chips("wc",uniq(WK.map(w=>w[1])),rw);rw("All");
const rp=m=>{$("pl").innerHTML=PL[m].map(p=>`<div class="card plan rv${p[4]?" hot":""}"><h3>${p[0]}${p[4]?'<span class="pop">Most chosen</span>':""}</h3><div class="price">${inr(p[1])} <small>${p[2]}</small></div><ul>${p[3].map(f=>`<li>${f}</li>`).join("")}</ul><a class="btn${p[4]?"":" g"}" href="#contact" data-plan="${p[0]}">Choose ${p[0]}</a></div>`).join("");rvAll($("pl"))};
rp("web");
document.querySelector(".tog").onclick=function(e){const b=e.target.closest("button");if(!b)return;qa("button",this).forEach(x=>x.setAttribute("aria-pressed",x===b));rp(b.dataset.m)};
document.addEventListener("click",e=>{
const s=e.target.closest("[data-sv]"),w=e.target.closest("[data-wk]"),p=e.target.closest("[data-plan]");
if(s){if(s.closest(".dm"))s.closest(".dd").classList.add("x");const x=SV[s.dataset.sv];dlg(x[2],x[3],x[4])}
if(w){const x=WK[w.dataset.wk];dlg(x[0],x[3]+" Result: "+x[5]+" "+x[6]+".",x[4])}
if(p){$("m").value="I am interested in the "+p.dataset.plan+" plan.";$("m").dispatchEvent(new Event("input"))}});
$("dc").onclick=()=>$("dlg").close();
$("dgo").onclick=()=>{$("m").value="I am interested in: "+$("dt").textContent+".";$("dlg").close()};
$("dlg").addEventListener("close",()=>{if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();qa(".dd").forEach(d=>d.classList.remove("x"))});
$("need").onclick=e=>{const b=e.target.closest(".chip");if(b)b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!=="true")};
$("b").oninput=function(){$("bo").textContent=inr(+this.value)};$("bo").textContent=inr(50000);
const val=()=>({name:$("n").value.trim(),email:$("e").value.trim(),phone:$("ph").value.trim(),needs:qa("#need .chip").filter(c=>c.getAttribute("aria-pressed")==="true").map(c=>c.textContent).join(", ")||"Not specified",budget:inr(+$("b").value),message:$("m").value.trim(),hp:$("hp").value,time:new Date().toLocaleString("en-IN")});
const txt=d=>`New enquiry from ${d.name}\nEmail: ${d.email}\nPhone: ${d.phone}\nNeeds: ${d.needs}\nBudget: ${d.budget}\n\n${d.message}`;
const lnk=(t,h,g)=>`<a class="btn${g?" g":""}" href="${h}" target="_blank" rel="noopener">${t}</a>`;
$("cf").addEventListener("submit",async ev=>{ev.preventDefault();let ok=true;const set=(id,s)=>{$(id).textContent=s;if(s)ok=false};
set("en",$("n").value.trim()?"":"Enter your name.");
set("ee",/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test($("e").value.trim())?"":"Enter a valid email address.");
set("ep",/^\+?[\d\s\-()]{7,}$/.test($("ph").value.trim())?"":"Enter a valid phone number.");
set("em",$("m").value.trim().length>=10?"":"Write at least 10 characters about your project.");
if(!ok)return;const d=val();if(d.hp)return;const t=txt(d),sb=$("cf").querySelector("[type=submit]");
const show=(h,p,a)=>{$("dh").textContent=h;$("dm").textContent=p;$("dact").innerHTML=a;$("cf").hidden=true;$("done").hidden=false};
if(CONFIG.endpoint){sb.disabled=true;sb.textContent="Sending…";
try{await fetch(CONFIG.endpoint,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(d)});
sb.disabled=false;sb.textContent="Send enquiry";$("cf").reset();qa("#need .chip").forEach(c=>c.setAttribute("aria-pressed","false"));
show("Thank you, "+d.name,"Your enquiry has reached our team. We will reply to "+d.email+" soon.",'<a class="btn g" href="#home">Back to home</a>');toast("Enquiry sent");return}
catch(x){sb.disabled=false;sb.textContent="Send enquiry"}}
const a=[];
if(EMAILS.length)a.push(lnk("Email our team","mailto:"+EMAILS.join(",")+"?subject="+encodeURIComponent("New enquiry from "+d.name)+"&body="+encodeURIComponent(t)));
WAS.forEach((w,i)=>a.push(lnk("WhatsApp"+(WAS.length>1?" "+(i+1):""),"https://wa.me/"+w+"?text="+encodeURIComponent(t),1)));
a.push('<button class="btn g" id="cp" type="button">Copy message</button>','<button class="btn g" id="bk" type="button">Edit details</button>');
show("Almost done",EMAILS.length||WAS.length?"Your details are ready. Send them with any option below. The email option goes to our whole team at once.":"Your details are ready. Copy them and send them to us.",a.join(""));
$("cp").onclick=()=>{try{navigator.clipboard.writeText(t).then(()=>toast("Copied"),()=>toast("Select and copy manually"))}catch(x){toast("Select and copy manually")}};
$("bk").onclick=()=>{$("cf").hidden=false;$("done").hidden=true}});

const cnt=new IntersectionObserver(en=>en.forEach(x=>{if(!x.isIntersecting)return;cnt.unobserve(x.target);const el=x.target,to=+el.dataset.n,s=el.dataset.s,t0=performance.now();const f=t=>{const k=Math.min((t-t0)/1500,1);el.textContent=Math.round(to*(1-Math.pow(1-k,4)))+s;if(k<1)requestAnimationFrame(f)};f(t0)}));
qa("[data-n]").forEach(e=>cnt.observe(e));
rvAll();

const route=()=>{let h=(location.hash||"#home").slice(1);if(!PG.includes(h))h="home";
PG.forEach(p=>$(p).classList.toggle("on",p===h));
qa("nav a").forEach(a=>a.classList.toggle("on",a.dataset.p===h));
$("nav").classList.remove("open");$("mb").setAttribute("aria-expanded","false");
document.title=(h==="home"?"SouGo Digital":h[0].toUpperCase()+h.slice(1)+" – SouGo Digital")+" – premium websites and marketing";
scrollTo(0,0);tl()};
const tl=()=>{const e=$("tl");if(!e||!$("home").classList.contains("on"))return;const r=e.getBoundingClientRect(),p=Math.min(1,Math.max(0,(innerHeight*.75-r.top)/r.height));e.style.setProperty("--p",p);qa("li",e).forEach((li,i,a)=>li.classList.toggle("on",(i+.2)/a.length<=p))};
addEventListener("hashchange",route);route();
addEventListener("scroll",()=>{document.querySelector("header").classList.toggle("sc",scrollY>20);const h=document.documentElement.scrollHeight-innerHeight;$("prog").style.width=(h>0?scrollY/h*100:0)+"%";tl()},{passive:true});
$("mb").onclick=function(){const o=$("nav").classList.toggle("open");this.setAttribute("aria-expanded",o)};
setTimeout(()=>$("pre").classList.add("out"),1700);
</script>
</body>
</html>
